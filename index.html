<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FastMash — Ranking Rápido y Furioso</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="wrap">
  <h1>🔥 FastMash</h1>
  <p class="sub">Comparación A/B para rankear películas de Rápido y Furioso</p>
</header>

<main class="wrap grid">

  <section class="card">
    <h2>1️⃣ Configura</h2>

    <label>Tipo de espectador</label>
    <select id="segmentSelect"></select>

    <label>Pregunta</label>
    <select id="contextSelect"></select>

    <div class="row">
      <button id="btnNewPair" class="ghost">🔁 Nuevo duelo</button>
      <button id="btnReset" class="danger">🧹 Reiniciar</button>
    </div>
  </section>

  <section class="card">
    <h2>2️⃣ Elige</h2>

    <p id="question" class="question">—</p>

    <div class="duel">
      <button id="btnA" class="pick">
        <span class="tag">A</span>
        <span id="labelA" class="title">—</span>
      </button>

      <button id="btnB" class="pick">
        <span class="tag">B</span>
        <span id="labelB" class="title">—</span>
      </button>
    </div>

    <p class="hint">Cada voto modifica el ranking (Elo).</p>

    <div class="row">
      <button id="btnExport" class="ghost">⬇️ Exportar votos</button>
      <button id="btnShowTop" class="primary">🏁 Ver Top 10</button>
    </div>
  </section>

  <section class="card">
    <h2>3️⃣ Ranking</h2>
    <div id="topBox" class="topbox"></div>
    <p class="hint">Ranking según perfil y pregunta.</p>
  </section>

</main>

<footer class="wrap foot">
  <small>Algoritmo A/B + Elo — decisiones humanas crean el ranking.</small>
</footer>

<script src="app.js"></script>
</body>
</html>
